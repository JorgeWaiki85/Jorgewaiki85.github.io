<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Informes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .tabs {
            display: flex;
            background-color: #333;
        }

        .tab-btn {
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #555;
            transition: background-color 0.3s;
        }

        .tab-btn:hover {
            background-color: #777;
        }

        .tab-btn.active {
            background-color: #fff;
            color: #333;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .delitos-bg {
            background-color: #E0F7FA;
        }

        .accidentes-bg {
            background-color: #FFCDD2;
        }

        .vigilancias-bg {
            background-color: #E1BEE7;
        }

        .form-section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-section h2 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #00796B;
            padding-bottom: 10px;
        }

        .accidentes-bg .form-section h2 {
            border-bottom-color: #C62828;
        }

        .vigilancias-bg .form-section h2 {
            border-bottom-color: #6A1B9A;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-section {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .checkbox-section label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .checkbox-section input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .camaras-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

        .camaras-checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: normal;
            cursor: pointer;
        }

        .camaras-checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dynamic-section {
            margin-top: 15px;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            border: 1px dashed #999;
        }

        .dynamic-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            border: 1px solid #ddd;
        }

        .dynamic-item h4 {
            margin-bottom: 10px;
            color: #555;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            background-color: #d32f2f;
        }

        .add-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .add-btn:hover {
            background-color: #45a049;
        }

        .send-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }

        .send-btn:hover {
            background-color: #20BA5C;
        }

        .clear-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }

        .clear-btn:hover {
            background-color: #d32f2f;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-container button {
            flex: 1;
        }

        .hidden {
            display: none;
        }

        .personnel-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
                padding: 12px 20px;
            }

            .tab-content {
                padding: 10px;
            }

            .form-section {
                padding: 15px;
                margin-bottom: 15px;
            }

            .form-row {
                flex-direction: column;
                gap: 10px;
            }

            .form-group input,
            .form-group textarea {
                width: 100%;
                font-size: 16px;
            }

            .personnel-section {
                grid-template-columns: 1fr;
            }

            .btn-container {
                flex-direction: column;
            }

            .send-btn,
            .clear-btn {
                width: 100%;
                padding: 15px;
                font-size: 16px;
            }

            .dynamic-item {
                padding: 12px;
            }

            .checkbox-section label {
                font-size: 14px;
            }

            .add-btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .form-section h2 {
                font-size: 16px;
            }

            .form-group label {
                font-size: 13px;
            }

            .form-group input,
            .form-group textarea {
                font-size: 14px;
                padding: 8px;
            }

            .dynamic-item h4 {
                font-size: 14px;
            }

            .remove-btn {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('delitos')">DELITOS</button>
        <button class="tab-btn" onclick="openTab('accidentes')">ACCIDENTES</button>
        <button class="tab-btn" onclick="openTab('vigilancias')">VIGILANCIAS</button>
    </div>

    <!-- PESTAÑA DELITOS -->

            </div>
            <div class="form-row hidden" id="del-camaras-municipales-row">

            <div class="form-row hidden" id="del-camaras-particulares-row">
                <div class="form-group">

                    <textarea id="del-camaras-particulares"></textarea>

            <div class="form-row hidden" id="del-camaras-corporales-row">

        <div class="form-section">

                    DATOS DE LA(S) VICTIMA(S)
                </label>
            </div>
            <div id="del-victimas-container" class="hidden">
                <div id="del-victimas-list"></div>
                <button class="add-btn" onclick="addVictima()">+ AGREGAR OTRA VICTIMA</button>
            </div>
        </div>

        <div class="form-section">
            <div class="checkbox-section">
                <label>
                    <input type="checkbox" id="del-vehiculo-check" onchange="toggleDelVehiculos()">
                    DATOS DEL/LOS VEHICULO(S)
                </label>
            </div>
            <div id="del-vehiculos-container" class="hidden">
                <div id="del-vehiculos-list"></div>
                <button class="add-btn" onclick="addDelVehiculo()">+ AGREGAR OTRO VEHICULO</button>

        <div class="form-section">
            <h2>ESPECIES SUSTRAIDAS</h2>

        <div class="form-section">

        <div class="form-section">

        </div>

        <div class="form-section">
            <div class="checkbox-section">
                <label>
                    <input type="checkbox" id="del-detenido-check" onchange="toggleDetenidos()">

                </label>
            </div>
            <div id="del-detenidos-container" class="hidden">
                <div id="del-detenidos-list"></div>
                <button class="add-btn" onclick="addDetenido()">+ AGREGAR OTRO DETENIDO</button>
            </div>
        </div>

        <div class="form-section">
            <div class="checkbox-section">
                <label>
                    <input type="checkbox" id="del-vehiculo2-check" onchange="toggleDelVehiculos2()">
                    DATOS DEL/LOS VEHICULO(S) SOSPECHOSOS
                </label>
            </div>
            <div id="del-vehiculos2-container" class="hidden">
                <div id="del-vehiculos2-list"></div>
                <button class="add-btn" onclick="addDelVehiculo2()">+ AGREGAR OTRO VEHICULO</button>
            </div>
        </div>

        <div class="form-section">
            <h2>HECHOS</h2>
            <div class="form-group">
                <textarea id="del-hechos"></textarea>
            </div>
        </div>

        <div class="form-section">
            <h2>PERSONAL</h2>
            <div class="personnel-section">
                <div class="form-group">
                    <label>PERSONAL BOMBEROS:</label>
                    <input type="text" id="del-bomberos">
                </div>
                <div class="form-group">

        <div class="btn-container">

                        <label><input type="checkbox" name="acc-camaras-tipo" value="MUNICIPALES" onchange="accCamarasTipoChanged()"> MUNICIPALES</label>
                        <label><input type="checkbox" name="acc-camaras-tipo" value="PARTICULARES" onchange="accCamarasTipoChanged()"> PARTICULARES</label>
                        <label><input type="checkbox" name="acc-camaras-tipo" value="CORPORALES" onchange="accCamarasTipoChanged()"> CORPORALES</label>

            <div class="form-row hidden" id="acc-camaras-municipales-row">

            <div class="form-row hidden" id="acc-camaras-particulares-row">

            <div class="form-row hidden" id="acc-camaras-corporales-row">
                <div class="form-group">

        </div>

        <div class="form-section">

                    DATOS DEL/LOS LESIONADO(S)
                </label>
            </div>
            <div id="acc-lesionados-container" class="hidden">

    <script>
        let detenidoCount = 0;
        let lesionadoCount = 0;
        let vehiculoCount = 0;
        let victimaCount = 0;
        let delVehiculoCount = 0;
        let delVehiculo2Count = 0;

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleVictimas() {
            const container = document.getElementById('del-victimas-container');
            const checkbox = document.getElementById('del-victima-check');
            if (checkbox.checked) {
                container.classList.remove('hidden');
                if (victimaCount === 0) addVictima();
            } else {
                container.classList.add('hidden');
            }
        }

        function addVictima() {
            victimaCount++;
            const list = document.getElementById('del-victimas-list');
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.id = `victima-${victimaCount}`;
            div.innerHTML = `
                <button class="remove-btn" onclick="removeVictima(${victimaCount})">×</button>
                <h4>VICTIMA ${victimaCount}</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>NOMBRE:</label>
                        <input type="text" id="del-victima-nombre-${victimaCount}">
                    </div>
                    <div class="form-group">
                        <label>RUN:</label>
                        <input type="text" id="del-victima-run-${victimaCount}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>DOMICILIO:</label>
                        <input type="text" id="del-victima-domicilio-${victimaCount}">
                    </div>
                    <div class="form-group">
                        <label>FONO:</label>
                        <input type="tel" id="del-victima-fono-${victimaCount}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>CORREO:</label>
                        <input type="email" id="del-victima-correo-${victimaCount}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>¿PRESENTA LESIONES?:</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="del-victima-lesiones-${victimaCount}" value="SI" onchange="toggleVictimaLesiones(${victimaCount})"> SI

        function sendWhatsApp(type) {
            let message = '';

            if (type === 'delitos') {
                const tipo = getValue('del-tipo');
                const fecha = getValue('del-fecha');
                const hora = getValue('del-hora');
                const lugar = getValue('del-lugar');
                const cuadrante = getValue('del-cuadrante');
                const funcionarios = getValue('del-funcionarios');

                const especies = getValue('del-especies');
                const avaluo = getValue('del-avaluo');
                const danos = getValue('del-danos');

                const hechos = getValue('del-hechos');
                const bomberos = getValue('del-bomberos');
                const salud = getValue('del-salud');
                const policial = getValue('del-policial');

                message = `*INFORME DE DELITOS*\n\n`;

                if (tipo) message += `*TIPO DE DELITO:* ${tipo}\n\n`;

                if (fecha || hora || lugar || cuadrante || funcionarios) {
                    message += `*PROCEDIMIENTO:*\n`;
                    if (fecha) message += `*FECHA:* ${fecha}\n`;
                    if (hora) message += `*HORA:* ${hora}\n`;
                    if (lugar) message += `*LUGAR:* ${lugar}\n`;
                    if (cuadrante) message += `*CUADRANTE:* ${cuadrante}\n`;
                    if (funcionarios) message += `*FUNCIONARIOS:* ${funcionarios}\n`;
                    message += '\n';
                }

                const camarasMunicipales = getValue('del-camaras-municipales');
                const camarasParticulares = getValue('del-camaras-particulares');
                const camarasCorporales = document.querySelectorAll('input[name="del-camaras-corporal"]:checked');
                const corporalesList = Array.from(camarasCorporales).map(cb => cb.value).join(', ');
                const camarasTiposSeleccionados = document.querySelectorAll('input[name="del-camaras-tipo"]:checked');

                if (camarasTiposSeleccionados.length > 0) {
                    message += `*CÁMARAS:*\n`;
                    if (document.querySelector('input[name="del-camaras-tipo"][value="MUNICIPALES"]').checked && camarasMunicipales) {
                        message += `*MUNICIPALES:* ${camarasMunicipales}\n`;
                    }
                    if (document.querySelector('input[name="del-camaras-tipo"][value="PARTICULARES"]').checked && camarasParticulares) {
                        message += `*PARTICULARES:* ${camarasParticulares}\n`;
                    }
                    if (document.querySelector('input[name="del-camaras-tipo"][value="CORPORALES"]').checked && corporalesList) {
                        message += `*CORPORALES:* ${corporalesList}\n`;
                    }
                    message += '\n';
                }

                if (document.getElementById('del-victima-check').checked) {
                    const items = document.querySelectorAll('#del-victimas-list .dynamic-item');
                    if (items.length > 0) {
                        message += `*DATOS DE LA(S) VICTIMA(S):*\n`;
                        items.forEach((item, index) => {
                            const num = index + 1;
                            const nombre = getValue(`del-victima-nombre-${num}`);
                            const run = getValue(`del-victima-run-${num}`);
                            const domicilio = getValue(`del-victima-domicilio-${num}`);
                            const fono = getValue(`del-victima-fono-${num}`);
                            const correo = getValue(`del-victima-correo-${num}`);
                            const lesionesRadio = document.querySelector(`input[name="del-victima-lesiones-${num}"]:checked`);
                            const lesionesEstado = lesionesRadio ? lesionesRadio.value : '';
                            const lesiones = getValue(`del-victima-lesiones-${num}`);
                            if (nombre || run || domicilio || fono || correo || lesionesEstado || lesiones) {
                                message += `\n*VICTIMA ${num}:*\n`;
                                if (nombre) message += `*NOMBRE:* ${nombre}\n`;
                                if (run) message += `*RUN:* ${run}\n`;
                                if (domicilio) message += `*DOMICILIO:* ${domicilio}\n`;
                                if (fono) message += `*FONO:* ${fono}\n`;
                                if (correo) message += `*CORREO:* ${correo}\n`;
                                if (lesionesEstado) message += `*¿PRESENTA LESIONES?:* ${lesionesEstado}\n`;
                                if (lesiones) message += `*LESIONES:* ${lesiones}\n`;
                            }
                        });
                        message += '\n';
                    }
                }

                if (avaluo) message += `*AVALUO:*\n${avaluo}\n\n`;
                if (danos) message += `*DAÑOS:*\n${danos}\n\n`;

                if (document.getElementById('del-vehiculo-check') && document.getElementById('del-vehiculo-check').checked) {

        function setVigilanciaDateTime() {
            const ahora = new Date();
            const fecha = ahora.getFullYear() + '-' + String(ahora.getMonth() + 1).padStart(2, '0') + '-' + String(ahora.getDate()).padStart(2, '0');
            const hora = String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
            document.getElementById('vig-fecha').value = fecha;
            document.getElementById('vig-hora').value = hora;
